# HueVista - Application Configuration
# Replace all CHANGEME values before running / deploying.

spring.application.name=HueVista

# --- Server ---
server.port=8080

# --- Load management: HTTP connector limits ---
# Cap concurrent worker threads and the accept backlog so a traffic spike sheds
# load (connections queue / are refused) instead of exhausting memory/CPU and
# taking the whole instance down. Tune per instance size.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
# Drop slow/stalled clients (Slowloris) rather than holding a worker thread.
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20s}
# Hard cap on request header + any swallowed body size (defence-in-depth vs huge requests).
server.tomcat.max-http-form-post-size=${TOMCAT_MAX_FORM_POST:12MB}
server.tomcat.max-swallow-size=${TOMCAT_MAX_SWALLOW:12MB}
# Graceful shutdown: let in-flight requests finish before the process exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_GRACE:25s}

# --- PostgreSQL Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/huevista
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) — load management ---
# Bound DB connections so request spikes wait briefly for a connection instead of
# opening unbounded connections and overwhelming Postgres. connection-timeout caps
# how long a thread blocks waiting for a free connection before failing fast.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}

# --- Schema migrations (Flyway) ---
# The schema is owned by versioned SQL in src/main/resources/db/migration, applied
# automatically at startup. baseline-on-migrate handles databases that predate
# Flyway (created by the old ddl-auto=update): a non-empty schema is stamped as
# already at V1 (the baseline) and only V2+ are applied; a fresh empty database
# gets V1 and everything after it.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JPA / Hibernate ---
# validate -> Hibernate only checks the schema matches the entities; it never
#             mutates it (Flyway owns all DDL). Override with SPRING_JPA_DDL_AUTO
#             only for throwaway environments.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Secret must be a Base64-encoded string of at least 256 bits (32 bytes).
# Generate with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
# Access token lifetime: 15 minutes (900 000 ms)
app.jwt.expiration-ms=900000

# --- Refresh Token ---
# 7 days (604 800 000 ms)
app.refresh-token.expiration-ms=604800000
# Rotation reuse grace window: a just-rotated refresh token is still honoured for
# this long, so parallel tabs/requests racing the same refresh don't log the user
# out. Reuse AFTER the window is treated as token theft and revokes all sessions.
app.refresh-token.reuse-grace-ms=${REFRESH_REUSE_GRACE_MS:60000}

# --- Google OAuth2 ---
# Create credentials at: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to add: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --- File Upload ---
# Max single file: 10 MB | Max whole request: 11 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Local storage path (override with env var; swap to S3 later)
app.upload.storage-path=${UPLOAD_PATH:/tmp/huevista/uploads}

# --- AWS S3 Storage ---
# Set S3_BUCKET_NAME env var (or override app.s3.bucket-name) to activate S3.
# Leave blank (default) to use local filesystem storage.
app.s3.bucket-name=${S3_BUCKET_NAME:}
app.s3.region=${S3_REGION:ap-south-1}
# app.s3.access-key=${AWS_ACCESS_KEY_ID:}        # leave blank to use IAM role
# app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}    # leave blank to use IAM role
# app.s3.presigned-url-expiry-minutes=60
# On startup, make sure the bucket lets app.cors.allowed-origins read objects from a
# browser. The studio draws every image onto a canvas (crossOrigin="anonymous"), which
# S3 refuses without a bucket CORS rule however the URL was signed. Needs
# s3:PutBucketCors; when the role lacks it the startup log prints the aws command to
# run instead. Set false to manage the bucket's CORS entirely by hand.
app.s3.configure-cors=${S3_CONFIGURE_CORS:true}

# --- Claude API ---
# API key from https://console.anthropic.com/
app.claude.api-key=${ANTHROPIC_API_KEY}
# Model used for image classification (ImageController)
app.claude.model=claude-haiku-4-5-20251001
# Model used for shade enrichment at seed time (ShadeEnrichmentService)
# Haiku is sufficient — structured JSON output, no vision needed
app.claude.enrichment-model=claude-haiku-4-5-20251001
# Model used for AI color recommendations (requires vision + reasoning)
app.claude.recommendation-model=claude-sonnet-4-6

# --- Springdoc / Swagger UI ---
# Swagger UI + the OpenAPI spec are PUBLIC (permitAll). They expose the full API
# surface, so they are OFF unless explicitly enabled: set SWAGGER_ENABLED=true in
# dev environments that want the UI (turns on both the UI and /v3/api-docs).
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

# === Replicate API (auto-segmentation + click-to-segment) ===
#
# Pipeline (top to bottom; later steps only used by manual click flow):
#   1. ImageCleanerService   (opt-in) — Nano Banana Pro removes clutter
#                            and refreshes painted surfaces in the same
#                            color, giving a clean canvas for masks.
#   2. ReplicateMaskSegmenter — single image-edit call (Nano Banana Pro)
#                            returns a color-coded mask
#                            (red=main wall, green=accent, blue=trim).
#                            Server splits into per-category binary masks.
#   3. SAM 2 (meta/sam-2)    — used only by the manual click-to-segment
#                            endpoint. Auto pipeline does NOT use SAM 2
#                            any more (was the old approach).
#
# Get a Replicate token at https://replicate.com/account/api-tokens
replicate.api-token=${REPLICATE_API_TOKEN:}

# --- Talking to a service that is regularly out of capacity ---
# How many predictions this process may have in flight on Replicate at once. The AI executor
# runs up to sixteen threads and hands overflow to the caller, so a burst could otherwise put
# twenty-odd simultaneous predictions on one account. This does not make a globally busy model
# less busy — retry and failover are what rescue those — but it stops us competing with
# ourselves for the capacity there is, and stops us tripping an account-level limit.
replicate.max-concurrent=${REPLICATE_MAX_CONCURRENT:6}
# How long a call waits for one of those slots before reporting itself retryable. Past this
# the queue in front of it is the problem, and the caller's backoff is a better place to
# spend the time than a lock.
replicate.acquire-timeout-ms=${REPLICATE_ACQUIRE_TIMEOUT_MS:120000}
# How many times ONE model is asked before the chain moves on to the next.
replicate.predictions.max-attempts=${REPLICATE_PREDICTION_MAX_ATTEMPTS:3}
# First wait after a busy model; doubles per attempt up to max-backoff-ms, with equal jitter
# (half the wait fixed, half random) so sixteen threads that met the same busy model do not
# re-ask it at the same instant.
replicate.predictions.retry-backoff-ms=${REPLICATE_PREDICTION_RETRY_BACKOFF_MS:5000}
replicate.predictions.max-backoff-ms=${REPLICATE_PREDICTION_MAX_BACKOFF_MS:45000}
# Gap between status checks on a running prediction.
replicate.predictions.poll-interval-ms=${REPLICATE_PREDICTION_POLL_INTERVAL_MS:2000}
# The ceiling on one whole call — every model, every attempt, every wait. It must stay well
# under app.render.stranded-after-minutes (below, floored at 10 minutes in code): a chain that
# outlived the sweeper would have the sweeper refund a customer whose image then arrives.
replicate.predictions.total-budget-ms=${REPLICATE_PREDICTION_TOTAL_BUDGET_MS:480000}

# SAM 2 model version hash (manual click-to-segment only). Optional —
# when blank, calls /models/meta/sam-2/predictions which always uses
# the latest published version.
replicate.sam2.model-version=${REPLICATE_SAM2_VERSION:}

# The models an ADMIN may pin ONE run to from the studio's testing panel, for the
# photo clean-up (cleanModel) and for wall detection (maskModel) — how two models get
# compared on the same photo without editing the config and restarting between them.
#
# This list is BOTH what the studio offers and what the segment endpoint accepts: a
# model id that is not here is refused with 400 rather than passed to Replicate, so the
# override can never become a free-text path on api.replicate.com.
#
# Comma-separated, each entry "owner/model" or "owner/model|Human label". Setting it
# REPLACES the built-in list (see AiModelCatalogue) — usually to narrow the choice to
# the models this account can actually bill, or to add one that shipped this week.
# Blank = the built-in list.
replicate.selectable-models=${REPLICATE_SELECTABLE_MODELS:}

# Auto mask generation model (ReplicateMaskSegmenter). Reuses your
# REPLICATE_API_TOKEN.
#
# Supported models on Replicate (no version pin required — Replicate
# manages versioning for you):
#   google/nano-banana-pro        Gemini 3 Pro Image (DEFAULT — ~$0.10/mask;
#                                 supports aspect_ratio "match_input_image"
#                                 so the mask keeps the photo's exact aspect)
#   google/nano-banana-2          Gemini 3.1 Flash Image (faster/cheaper)
#
# To enable: REPLICATE_NANO_BANANA_ENABLED=true. When false,
# auto-segmentation fails clearly and the UI falls back to click-segment.
# NOTE: REPLICATE_NANO_BANANA_MODEL in your deployment env overrides this
# default — unset it to get Nano Banana Pro.
replicate.nano-banana.enabled=${REPLICATE_NANO_BANANA_ENABLED:false}
replicate.nano-banana.model=${REPLICATE_NANO_BANANA_MODEL:google/nano-banana-pro}
replicate.nano-banana.model-version=${REPLICATE_NANO_BANANA_VERSION:}
# Mask output resolution (1K/2K/4K). 2K keeps surface boundaries crisp when the
# mask is stretched over the studio's large canvas; the request automatically
# retries without this key on models that don't support it.
replicate.nano-banana.resolution=${REPLICATE_NANO_BANANA_RESOLUTION:2K}

# Image cleaner (preprocessing). Runs Nano Banana Pro on the photo BEFORE
# mask generation to remove visual clutter (wires, bushes, parked cars,
# garbage, hanging laundry, scaffolding, people) AND repaint the painted
# surfaces into the reference palette. The cleaned image becomes both the
# paint-preview canvas and the mask-generation input.
#
# Tradeoff: this is generative editing. The model regenerates the photo
# with some drift (textures smoothed, fine details slightly altered).
# On by default; set this to false to skip it. The original image always
# stays in S3 untouched so the frontend can fall back.
#
# Cost: ~$0.10 per upload on Nano Banana Pro. Doubles per-upload
# Replicate spend (clean + mask = 2 calls). Adds ~5-10s latency.
replicate.image-cleaner.enabled=true
replicate.image-cleaner.model=${REPLICATE_IMAGE_CLEANER_MODEL:google/nano-banana-pro}
# Generation resolution requested from the model (Nano Banana Pro accepts 1K/2K/4K).
# Generating at 1K is cheaper/faster; we then upscale the result locally (below).
# Leave blank to let the model pick its own default / for models without the param.
replicate.image-cleaner.resolution=${REPLICATE_IMAGE_CLEANER_RESOLUTION:1K}
# After download, upscale the cleaned image to this longest-edge size (px) with a
# local Java resampler (Thumbnailator) — 3840 ≈ 4K. Set 0 to keep the model output as-is.
replicate.image-cleaner.upscale-longest-px=${REPLICATE_IMAGE_CLEANER_UPSCALE_PX:3840}
# How many times ONE provider is asked for the clean before moving on to the next.
# Replicate answers a busy model with a prediction that ends "failed:
# ModelRateLimitError: Service is currently unavailable due to high demand (E003)" —
# nothing is wrong with the photo, there was simply no room, and asking again shortly
# often works. Kept low on purpose: a single attempt takes most of a minute, the studio
# gives the whole run 8 minutes, and the Gemini fallback below is a better use of what
# is left than a third try here.
replicate.image-cleaner.max-attempts=${REPLICATE_IMAGE_CLEANER_MAX_ATTEMPTS:2}
# Wait before re-asking the same provider, multiplied by the attempt number (15s, 30s…).
replicate.image-cleaner.retry-backoff-ms=${REPLICATE_IMAGE_CLEANER_RETRY_BACKOFF_MS:15000}
# The models tried, in order, once the primary above AND the direct Google route below
# have both failed. This matters more than it used to: wall detection now runs ONLY on a
# cleaned canvas, so a clean nobody will serve fails the whole run.
#
# Different FAMILIES on purpose. By the time the chain reaches here, two routes to Gemini
# have already declined, so the useful question is whether a different model sees this
# photo differently — not whether Gemini will change its mind.
#   black-forest-labs/flux-2-pro   FLUX.2 [pro] — closest to Nano Banana Pro on
#                                  high-end realism and precise localised editing.
#                                  (flux-2-max is the higher tier; flux-kontext-pro
#                                  also works — its single-image schema is handled.)
#   openai/gpt-image-1             GPT Image — strong multi-object reasoning and
#                                  natural-language instruction following. REQUIRES
#                                  OPENAI_API_KEY (below): Replicate passes it through
#                                  to OpenAI and bills that account. Skipped when unset.
#   bytedance/seedream-4           Seedream 4 — fast, cheap, and a genuinely different
#                                  model lineage, which is what a last resort should be.
# Each id's request schema is picked from its name (ReplicateImageEditor), so a newer
# tier — flux-2-max, seedream-4-5, gpt-image-1-mini — can be swapped in here with no
# code change. Set to blank to turn the extra fallbacks off entirely.
replicate.image-cleaner.fallback-models=${REPLICATE_IMAGE_CLEANER_FALLBACK_MODELS:black-forest-labs/flux-2-pro,openai/gpt-image-1,bytedance/seedream-4}

# OpenAI key, used ONLY as an input to openai/* models on Replicate (they are a wrapper
# around OpenAI's own API and bill the key's account, so Replicate requires it in the
# request). Blank = GPT Image is skipped in the fallback chain above and the next model
# is asked instead. Get one at https://platform.openai.com/api-keys.
openai.api-key=${OPENAI_API_KEY:}

# === Google Gemini image API (direct fallback for the image cleaner) ===
#
# The same models, without Replicate in front of them: google/nano-banana-pro on
# Replicate IS Gemini 3 Pro Image. Replicate keeps its own capacity pool, and when that
# pool is full every clean fails with E003 no matter how good the photo is. With a key
# set here, a clean that Replicate cannot serve is retried straight against Google,
# which is a different queue. Leave the key blank and the fallback is simply off — the
# cleaner behaves exactly as before and the original photo stays the canvas.
#
# HOW TO GET A KEY
#   1. Go to https://aistudio.google.com/apikey (sign in with a Google account).
#   2. "Create API key" → pick or create a Google Cloud project → copy the key.
#      A key from any project works; billing decides the rate limits, not access.
#   3. The free tier is heavily rate limited and image models are usually NOT on it,
#      so for production enable billing on that project: Google Cloud console →
#      Billing → link a billing account. Then in AI Studio the key moves to the paid
#      tier automatically.
#   4. Put it in the deployment environment as GEMINI_API_KEY (never commit it).
#   5. Check the current image model ids at https://ai.google.dev/gemini-api/docs/models
#      and set GEMINI_IMAGE_MODEL if the default below has been superseded. Image
#      generation models are the ones whose id contains "image".
#
# Note this is the Gemini API (AI Studio), NOT Vertex AI — Vertex uses a Google Cloud
# service account and a different endpoint, and needs no key here.
google.gemini.api-key=${GEMINI_API_KEY:}
# gemini-3-pro-image-preview is "Nano Banana Pro" — the same model the Replicate path
# uses by default, so the cleaned canvas looks the same whichever route produced it.
# gemini-2.5-flash-image is the cheaper/faster sibling if cost matters more than fidelity.
google.gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-3-pro-image-preview}

# --- Closing render (the photorealistic image a finished project produces) ---
# Three tiers, and a tier IS a model. The customer picks one on the render screen and pays
# for it in credits (app.ai-credit.render-cost*): 1 for BASIC, 2 for PRO, 4 for MAX. The
# price difference is a real cost difference between the models below, not a fence — which
# is why BASIC is a whole picture on its own rather than a deliberately poor one.
#
# FLUX.2 leads every tier and Nano Banana backs it up. The fallback is deliberately a
# DIFFERENT family: Replicate answers a model with no capacity by FAILING the prediction
# with "ModelRateLimitError ... high demand (E003)", and a second model from the same family
# tends to be out of capacity at the same moments as the first. Every entry here reads a
# LIST of images under its own input key, which the render needs (cleaned photo first, then
# the region masks). Do NOT put flux-kontext in any tier: it edits exactly one image, so it
# would quietly drop the masks and ignore "keep the original borders".
#
# Resolutions are written in Nano Banana's 1K/2K/4K units and translated per family
# (FLUX reads them as megapixels), so one setting is understood by both models in a tier.
replicate.render.quality.basic.model=${REPLICATE_RENDER_BASIC_MODEL:black-forest-labs/flux-2-klein}
replicate.render.quality.basic.fallback-models=${REPLICATE_RENDER_BASIC_FALLBACK_MODELS:google/nano-banana}
replicate.render.quality.basic.resolution=${REPLICATE_RENDER_BASIC_RESOLUTION:1K}
replicate.render.quality.pro.model=${REPLICATE_RENDER_PRO_MODEL:black-forest-labs/flux-2-pro}
replicate.render.quality.pro.fallback-models=${REPLICATE_RENDER_PRO_FALLBACK_MODELS:google/nano-banana-pro}
replicate.render.quality.pro.resolution=${REPLICATE_RENDER_PRO_RESOLUTION:2K}
replicate.render.quality.max.model=${REPLICATE_RENDER_MAX_MODEL:black-forest-labs/flux-2-max}
replicate.render.quality.max.fallback-models=${REPLICATE_RENDER_MAX_FALLBACK_MODELS:google/nano-banana-pro}
replicate.render.quality.max.resolution=${REPLICATE_RENDER_MAX_RESOLUTION:4K}
# A last resort appended under EVERY tier, empty by default. It exists so an operator whose
# whole primary family is down can add a model in one environment variable rather than in a
# deploy. Empty by default on purpose: a tier is a promise about which model made the
# picture, and a silent third choice quietly breaks that promise.
replicate.render.fallback-models=${REPLICATE_RENDER_FALLBACK_MODELS:}
# Same reason as the cleaner's: Gemini image models generate into fixed aspect buckets by
# default, and a render at a different aspect than the photo is a different room.
replicate.render.aspect-ratio=${REPLICATE_RENDER_ASPECT_RATIO:match_input_image}
# How long a render may sit without reaching READY or FAILED before the sweeper presumes
# it dead, fails it and hands the allowance back. The allowance is spent up front, so a
# render that reaches neither state has taken the customer's money and told them nothing —
# see ProjectRenderSweeper. Well past the model's own ~3 minute ceiling on purpose:
# refunding a render that then arrives is worse than one that is merely slow. Floored at
# 10 minutes in code.
app.render.stranded-after-minutes=${RENDER_STRANDED_AFTER_MINUTES:30}

# --- Stub AI pipeline (TESTING ONLY — must stay false in production) ---
# Lets you exercise the whole upload -> project -> recolour -> share flow
# without spending anything on image models. When true:
#   * the image cleaner NEVER runs — the uploaded photo is left exactly as it
#     is and stays the project canvas (no clutter removal, no repaint). The
#     Claude cleaning-hint call nested inside the cleaner is skipped too.
#   * the colour-coded mask is drawn locally as three equal VERTICAL stripes —
#     RED | GREEN | BLUE — instead of being generated by Nano Banana.
#     That yields all three regions every time (main wall, accent wall, trim),
#     so every downstream feature has something to work with.
#   * no REPLICATE_API_TOKEN is required for the auto pipeline.
#
# Still LIVE in this mode (deliberately):
#   * Claude image classification at upload time — the INDOOR / OUTDOOR /
#     "not a house" check keeps hitting the real API, which is the one AI call
#     worth testing for real.
#   * click-to-segment (SAM 2) — that is an on-demand action, not part of the
#     automatic pipeline, and still needs a Replicate token.
#   * billing — a stub run charges credits like a real one, so plan limits and
#     quota errors stay testable.
huevista.testing.stub-ai.enabled=${HUEVISTA_TESTING_STUB_AI_ENABLED:false}

# --- Simulated AI failure (TESTING ONLY — must stay NONE in production) ---
# The opposite of the stub above: instead of making the models cheap, this makes
# them DECLINE, so the two recovery paths can be walked through on demand rather
# than waited for. NONE (default) / CLEAN / MASK / BOTH:
#   * CLEAN — every cleaning provider declines. There is no canvas to align masks
#     to, so the run FAILS at the clean stage and the mask model is never called.
#   * MASK  — the clean lands and wall detection then returns nothing usable. The
#     run does NOT fail: the project comes back SEGMENTED on its cleaned canvas
#     with no walls, the studio asks for them by hand, and the pipeline files a
#     mask report with the admin on the user's behalf.
#   * BOTH  — what a completely unavailable Nano Banana looks like (the clean
#     fails first, so the run ends there).
# The models are never called for a simulated stage, so a simulated run is free.
#
# This is the deployment-wide switch, meant for a local or staging box. On a
# shared environment use the per-run ADMIN knob instead — `simulateFailure` on
# POST /api/projects/{id}/segment — which takes the same four values, is stored
# on that one project, and overrides this setting in both directions (an explicit
# NONE forces an honest run even when this is on).
huevista.testing.simulate-ai-failure=${HUEVISTA_TESTING_SIMULATE_AI_FAILURE:NONE}

# --- Base URL (this API's own origin) ---
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Website base URL (used for share link generation) ---
# A share link is forwarded to someone WITHOUT the app, so it has to open the
# website's /share/{token} page rather than the JSON endpoint that page reads.
# Leave blank to use the first CORS allowed origin below, which is the website
# in any deployment that has one.
app.web-base-url=${WEB_BASE_URL:}

# --- CORS ---
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Admin bootstrap ---
# On startup, seed a single ROLE_ADMIN with these credentials IF both are set and no
# such account exists. Leave blank to skip. Keep the password OUT of source — set it
# via the ADMIN_PASSWORD env var / your secrets store, never commit it.
#
# This is a LOGIN IDENTITY, not an inbox. It used to double as the destination for
# public shop-lead notifications, which meant the platform's own admin credentials had
# to be a mailbox several people could read. The lead inbox is app.leads.email below.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Where "request a shop account" submissions from the public /trial form are sent.
# A shared, readable inbox — deliberately separate from the admin login above.
# Falls back to app.admin.email when unset, so existing deployments keep working.
app.leads.email=${LEADS_EMAIL:leads@huevista.org}

# Where "the AI got this wrong" reports raised from the studio are announced — the
# clean that never came back, the walls that landed in the wrong places.
# The report itself always lands in the admin console regardless of this — the mail
# is only a nudge so nobody has to poll the queue. Set to blank to fall back to
# app.admin.email, and to send nothing at all when that is blank too.
app.support.email=${SUPPORT_EMAIL:support@huevista.org}

# --- Razorpay ---
# API keys from https://dashboard.razorpay.com/app/keys
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Webhook secret set in Razorpay dashboard → Webhooks
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Razorpay Plan IDs (create plans in dashboard, paste IDs here — see
# docs/RAZORPAY_SETUP.md for the full walkthrough).
# IMPORTANT: each dashboard plan must be created for the amount Plan.java quotes,
# monthly / every 1 month. GST_PERCENT is currently 0, so that is the base price
# with nothing added:
#   Starter        99900 paise (Rs.   999)
#   Professional  249900 paise (Rs. 2,499)
#   Business      499900 paise (Rs. 4,999)
# Nothing cross-checks these against the dashboard, so a mismatch silently bills a
# different amount than the pricing page shows. If GST_PERCENT is ever restored to
# 18, recreate the plans at the gross amounts — Razorpay plan amounts are immutable.
razorpay.plan.starter=${RAZORPAY_PLAN_STARTER:}
razorpay.plan.professional=${RAZORPAY_PLAN_PROFESSIONAL:}
razorpay.plan.business=${RAZORPAY_PLAN_BUSINESS:}

# --- Project validity ---
# How long a bought project — or a reopen — stays workable. The window pauses while a
# subscription is covering the account and resumes when that subscription ends, so the
# days are days OF USE rather than a calendar deadline.
app.project-credit.valid-days=${PROJECT_CREDIT_VALID_DAYS:30}
app.project-credit.currency=${PROJECT_CREDIT_CURRENCY:INR}

# --- In-store kiosk (public store links + shop reward points) ---
# ONE flat platform-wide price for a kiosk visualisation, set here and not by the
# shop. The walk-in customer is HueVista's own customer: the whole amount is
# collected for our own service and no share is ever settled to the shop. That is
# what keeps this a plain B2C sale instead of collecting on a third party's behalf,
# which is a regulated pattern needing Razorpay Route (see docs/RAZORPAY_SETUP.md).
# ₹99. Deliberately under the ₹199 a plan-less signed-in customer pays for a project:
# a walk-in is buying at a counter with the shop standing there, on a phone they may
# never use for this again, and the sale has to survive being decided in a minute.
app.store.price-paise=${STORE_PRICE_PAISE:9900}
# How long the code a walk-in buys lasts. Not a per-shop choice: the shop's kiosk link
# is permanent and configures nothing, and it sits beside counter-issued codes that run
# a fixed 10 days — three numbers a shop could set for the same idea was two too many.
# The walk-in takes this code home and re-enters it at /unlock to pick the room back up,
# so it has to outlive the trip.
app.store.code-valid-days=${STORE_CODE_VALID_DAYS:3}
# Reward POINTS the shop whose link was used earns per sale (see app.points.* below).
app.store.bonus-points=${STORE_BONUS_POINTS:30}
app.store.currency=${STORE_CURRENCY:INR}

# --- Reward points (retailers only) ---
# Points are a CLOSED-LOOP currency, not wallet money. They are earned from kiosk
# sales and spent on the prices below — which are deliberately their OWN list, not a
# rupee conversion, so a point is worth slightly more spent than the cash price of
# the same thing (40 points for an image that costs Rs. 50). There is no path back
# out to cash; adding one would recreate the third-party-settlement problem the
# flat-price kiosk exists to avoid.
#
# Points are RETAILER-only. A customer or painter account can neither earn nor spend
# them: the things points buy (plan overage, projects) are all shop-side.
# Points are the ONLY balance in the product. There is no prepaid rupee wallet and
# no per-item cash checkout: a shop either earns points at its kiosk or buys them,
# and everything chargeable is then paid for in points.
#
# Buying: one rupee buys one point (so a Rs. 100 top-up is 100 points). That makes
# bought points about 20% better value than the old per-item cash prices — an image
# was Rs. 50 and is 40 points — which is deliberate: it is the reason to top up, and
# it keeps bought and earned points worth exactly the same when spent.
app.points.rupees-per-point=${POINTS_RUPEES_PER_POINT:1}
# Smallest and largest single purchase, in POINTS. The floor keeps card fees sane.
app.points.min-purchase=${POINTS_MIN_PURCHASE:100}
app.points.max-purchase=${POINTS_MAX_PURCHASE:100000}
# What one extra PROJECT costs is a property of the plan, not a setting — it falls
# with the tier (80 points / Rs. 199 with no plan, down to 40 / Rs. 45 on Business),
# so it lives on the Plan enum where the tier that sets it is defined.
# A REOPEN is flat: it buys another validity window on work already paid for once,
# and there is no reason for that to be dearer for a smaller shop.
# Rs. 9 on both rails, deliberately the same number: quoting a reopen at 9 points in
# one place and Rs. 10 in another made the cash rail look like a penalty for not
# holding points, when the two are meant to be the same purchase.
app.points.reopen=${POINTS_PRICE_REOPEN:9}
app.project-credit.reopen-price-paise=${PROJECT_REOPEN_PRICE_PAISE:900}
# Reopening a CLOSED project is a different purchase and carries its own price.
# A lapsed window is a clock running out on work nobody finished; closing is the
# customer saying they are done, after their colour board and an AI render. Reopening
# that unlocks the whole catalogue again on a job that already delivered everything it
# promised, so it is priced at half a project (Rs. 99 of Rs. 199) rather than the Rs. 9
# a lapsed window costs. Both rails carry the same number, as above.
app.points.reopen-closed=${POINTS_PRICE_REOPEN_CLOSED:99}
app.project-credit.reopen-closed-price-paise=${PROJECT_REOPEN_CLOSED_PRICE_PAISE:9900}
# How many colour boards (PDFs) one project may hand over before it closes itself.
# FOUR. Each board is still the whole set on one sheet — that part was right, and is why
# this is not back to splitting four images across two downloads. What one board got
# wrong was assuming a room is decided in a single pass. People compare: the greens on
# one board, the greys on another, and a third for whatever somebody at home preferred.
# At a cap of one, the second of those was a closed project and a Rs. 99 reopen, so the
# natural way to use the product was the way that charged for it. Four covers that and
# is still finite, which is what keeps closing meaningful — a project that never closes
# never unlocks its AI render either. See ProjectBoardService.
app.project.colour-boards-per-project=${COLOUR_BOARDS_PER_PROJECT:4}
# Pictures on a GUEST's colour board — a walk-in working on a shop's access code or a
# kiosk code, who has no plan of their own. Five, because that board is now the whole
# deliverable: one download, and the project is finished. It is applied as a FLOOR, not
# a ceiling, so a walk-in on a bigger shop's plan keeps that plan's larger board.
# Account holders are unaffected; their cap is their own plan's pdfImageLimit.
app.project.guest-images-per-board=${GUEST_IMAGES_PER_BOARD:5}
# A second AI render on the same project, in paise. Flat, and deliberately the same
# number as a closed reopen: both are "one more go at a job you already finished".
app.render.top-up-price-paise=${RENDER_TOP_UP_PRICE_PAISE:9900}

# --- AI image credits (the wallet) ---
#
# The other rail for the same picture. One credit is one AI image, bought in advance and
# spendable on any room, rather than a payment sheet per project.
#
# Who holds one: a SHOP that would rather keep images on hand, and — the reason this
# exists — a CUSTOMER. A project a shop gives away includes NO AI image (the shop paid for
# the room out of its monthly quota, not for the model call at the end of it), and a
# customer account can hold no reward points and cannot buy a plan, so credits are the only
# way for them to get the picture at all.
#
# Pricing is a LIST price plus a discount percentage, not two separate prices. Two prices
# drift — somebody moves one and leaves the other — and the strike-through the customer is
# shown then becomes a lie. At launch: Rs. 198 less 50% = Rs. 99, deliberately equal to the
# per-project top-up above, so nobody is ever worse off for having topped up in advance.
# Set the discount to 0 to end the offer; the list price becomes what is charged.
app.ai-credit.list-price-paise=${AI_CREDIT_LIST_PRICE_PAISE:19800}
app.ai-credit.launch-discount-percent=${AI_CREDIT_LAUNCH_DISCOUNT_PERCENT:50}
# Bounds on one top-up. The floor is 1 because a customer buying a single image is the
# whole point; the ceiling is a guard on a client-supplied count the server multiplies.
app.ai-credit.min-purchase=${AI_CREDIT_MIN_PURCHASE:1}
app.ai-credit.max-purchase=${AI_CREDIT_MAX_PURCHASE:50}
# Credits one AI image costs, per quality tier. Quoted from here so the numbers are stated
# once rather than typed at three call sites, and so the render screen can label the choice
# from the server's own figures instead of holding its own copy.
#
# A project's INCLUDED image is a BASIC one. Choosing better on a room that still has its
# included image spends the allowance and tops up the difference (PRO costs 1 more credit,
# MAX 3) rather than forfeiting it — see ProjectRenderService#charge.
app.ai-credit.render-cost=${AI_CREDIT_RENDER_COST:1}
app.ai-credit.render-cost-pro=${AI_CREDIT_RENDER_COST_PRO:2}
app.ai-credit.render-cost-max=${AI_CREDIT_RENDER_COST_MAX:4}

# --- The customer catalogue (the /my-projects cart) ---
# What a CUSTOMER buys, and the only price list in the product with a quantity beside each
# line. Everything else in this file is shop-side — a tier's rate, a points price, a
# discount that moves with a subscription — and a customer has none of those.
#
# These are FINAL prices: Plan.GST_PERCENT is 0, so what is set here is what is charged. If
# tax is ever switched on, this list has to move with it rather than being grossed up
# quietly, because a catalogue whose displayed price is not the price paid is the one thing
# a shopping cart may never do.
#
# The combo is priced below its parts (Rs. 199 against Rs. 149 + 2 x Rs. 35 = Rs. 219) and
# is the line most people want: a room, and the pictures to come out of it.
app.customer-catalogue.project-price-paise=${CATALOGUE_PROJECT_PRICE_PAISE:14900}
app.customer-catalogue.credit-price-paise=${CATALOGUE_CREDIT_PRICE_PAISE:3500}
app.customer-catalogue.combo-price-paise=${CATALOGUE_COMBO_PRICE_PAISE:19900}
app.customer-catalogue.combo-projects=${CATALOGUE_COMBO_PROJECTS:1}
app.customer-catalogue.combo-credits=${CATALOGUE_COMBO_CREDITS:2}
# A year on every line, and it means the same thing on both: a project credit opens a room
# that stays open this long, and an AI credit has this long to be spent. One number so the
# cart can promise one thing without that promise being true of only half of it.
#
# Note what this does NOT do: it does not date credits already in a wallet. Expiry is
# decided when a credit is BOUGHT and stored on the batch (ai_credit_lots), so credits sold
# to shops still never expire, exactly as they were sold.
app.customer-catalogue.validity-days=${CATALOGUE_VALIDITY_DAYS:365}
# The most of any ONE line in a single order. A cart is not a wholesale channel, and an
# unbounded quantity is an unbounded Razorpay amount.
app.customer-catalogue.max-quantity=${CATALOGUE_MAX_QUANTITY:20}
# The offers, as CODE:minimum-subtotal-paise:percent-off. The threshold is on the basket
# subtotal and is inclusive — "Rs. 289 and above" is how it reads to the buyer, and a
# threshold that quietly meant Rs. 289.01 would refuse the one basket somebody built on
# purpose to reach it. The server works out the best offer a basket has earned whatever the
# client sends, so a code that has not been earned takes nothing off. Set empty to end them.
app.customer-catalogue.offers=${CATALOGUE_OFFERS:HUE10:28900:10,HUE20:58900:20,HUE25:98900:25}
# How long points last, from the day they arrive — earned and bought alike. Batches
# age independently: changing this affects points credited AFTER the change, never
# ones already dated.
app.points.validity-days=${POINTS_VALIDITY_DAYS:365}
# How many days ahead of expiry the warning e-mail goes out. A second notice is sent
# on the expiry day itself.
app.points.expiry-warning-days=${POINTS_EXPIRY_WARNING_DAYS:10}
# Public kiosk order/verify per-IP throttle (one shop's customers share the kiosk IP).
app.rate-limit.store-order.max-attempts=${RATE_LIMIT_STORE_ORDER_MAX:60}
app.rate-limit.store-order.window-seconds=${RATE_LIMIT_STORE_ORDER_WINDOW:3600}

# --- Email + Mobile verification (6-digit OTP) ---
# Senders are pluggable: when app.mail.enabled=true AND spring.mail.host is set,
# real e-mails go out; otherwise the code is logged to the server console (dev).
# SMS has NO delivery provider wired: SmsSender only logs the code to the server
# console. app.sms.enabled therefore stays false — see the warning below.
#
# IMPORTANT: these flags also drive the retailer verification gate
# (ProjectAccessPolicy). A retailer must verify a channel before creating projects
# ONLY when that channel is enabled here — requiring a phone OTP that can never be
# delivered (sms disabled) would hard-block every retailer. Production should set
# MAIL_ENABLED=true for the email gate; do NOT set SMS_ENABLED=true until a real
# SMS provider is implemented in SmsSender, or every retailer is locked out waiting
# for a code that is only ever written to the log.
app.mail.enabled=${MAIL_ENABLED:false}
# EVERY sender below must live on ONE authenticated domain, and the SMTP account must
# be allowed to send as each of them — a provider that is asked to send as an address
# it cannot authenticate will rewrite the From or drop the message outright. The
# defaults used to straddle huevista.app, huevista.org and huevista.com, which is that
# failure waiting to happen; they are all .org now.
#
# Transactional sender: verification codes, password resets, welcome mails, admin 2FA
# login codes, "your customer wants another project", "a customer sent you their room",
# and payout notices.
app.mail.from=${MAIL_FROM:no-reply@huevista.org}
# Payment / subscription receipts and renewal notices.
app.mail.billing-from=${MAIL_BILLING_FROM:payments@huevista.org}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.sms.enabled=${SMS_ENABLED:false}

# --- Redis ---
# Redis is used for caching + the segmentation job queue via RedisTemplate, NOT as a
# Spring Data repository store — disable repo scanning so all JpaRepository interfaces
# (e.g. AuditLogRepository) are unambiguously claimed by JPA.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Cache TTLs
app.cache.shade-ttl-minutes=60

# --- Load management: async AI executor + segmentation queue ---
# Bounds the pool that runs AI/segmentation work off the request thread. When the
# queue fills, new work runs on the caller (CallerRunsPolicy) as backpressure
# rather than being dropped — see AsyncConfig.
app.async.core-pool-size=${AI_EXECUTOR_CORE:4}
app.async.max-pool-size=${AI_EXECUTOR_MAX:16}
app.async.queue-capacity=${AI_EXECUTOR_QUEUE:100}
# Reject new segmentation enqueues once the Redis backlog reaches this depth, so a
# burst of uploads returns 503 (try later) instead of growing the queue without limit.
app.segmentation.queue.max-depth=${SEGMENTATION_QUEUE_MAX:500}

# --- Rate limiting (per-IP, Redis-backed, fail-open if Redis is down) ---
# Master switch for ALL per-IP limiters (signup + the sensitive-endpoint filter).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Whether the limiters may trust X-Forwarded-For / X-Real-IP for the client IP.
# Keep true ONLY while the backend is reachable exclusively through our own
# frontend/proxy (which sets the header). If the backend port is exposed directly,
# set false — otherwise callers can spoof the header to bypass every per-IP limit.
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED:true}
# How many proxies in front of this backend append to X-Forwarded-For (trust
# counts from the RIGHT of the header — the leftmost entries are whatever the
# client typed). 1 = the Next.js frontend, which normalises the header itself.
app.rate-limit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
# Signup (account creation) — the original abuse target.
app.rate-limit.signup.max-attempts=${RATE_LIMIT_SIGNUP_MAX:10}
app.rate-limit.signup.window-seconds=${RATE_LIMIT_SIGNUP_WINDOW:3600}
# Login — caps credential stuffing / password spraying per IP (per-account lockout
# also applies independently in AuthService).
app.rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX:15}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:300}
# Token refresh.
app.rate-limit.refresh.max-attempts=${RATE_LIMIT_REFRESH_MAX:60}
app.rate-limit.refresh.window-seconds=${RATE_LIMIT_REFRESH_WINDOW:300}
# Password reset request + confirm — anti reset-email bomb + 6-digit OTP brute force.
app.rate-limit.password-reset.max-attempts=${RATE_LIMIT_PWRESET_MAX:8}
app.rate-limit.password-reset.window-seconds=${RATE_LIMIT_PWRESET_WINDOW:900}
# Email/SMS verification code SEND — anti message-bomb (each send costs money).
app.rate-limit.otp-send.max-attempts=${RATE_LIMIT_OTP_SEND_MAX:6}
app.rate-limit.otp-send.window-seconds=${RATE_LIMIT_OTP_SEND_WINDOW:900}
# Email/SMS verification code CONFIRM — 6-digit code brute force defence.
app.rate-limit.otp-confirm.max-attempts=${RATE_LIMIT_OTP_CONFIRM_MAX:12}
app.rate-limit.otp-confirm.window-seconds=${RATE_LIMIT_OTP_CONFIRM_WINDOW:900}
# Access-code redeem (incl. public guest redeem) — 8-char code brute force / griefing.
app.rate-limit.code-redeem.max-attempts=${RATE_LIMIT_CODE_REDEEM_MAX:12}
app.rate-limit.code-redeem.window-seconds=${RATE_LIMIT_CODE_REDEEM_WINDOW:900}
# Image upload (user + guest) — every authenticated upload triggers a paid Claude
# Vision classification that is NOT quota-charged, so cap the per-IP burn rate.
app.rate-limit.image-upload.max-attempts=${RATE_LIMIT_IMAGE_UPLOAD_MAX:30}
app.rate-limit.image-upload.window-seconds=${RATE_LIMIT_IMAGE_UPLOAD_WINDOW:3600}
# Shop-account request form (public write) — anti-spam.
app.rate-limit.lead.max-attempts=${RATE_LIMIT_LEAD_MAX:5}
app.rate-limit.lead.window-seconds=${RATE_LIMIT_LEAD_WINDOW:3600}
# Gallery "paint this room" — signed-in, but the only project-creating endpoint that
# charges nothing at all, so this cap is what bounds it.
app.rate-limit.free-start.max-attempts=${RATE_LIMIT_FREE_START_MAX:40}
app.rate-limit.free-start.window-seconds=${RATE_LIMIT_FREE_START_WINDOW:3600}

# --- Support (in-app chat widget) ---
# Support AI agent model (falls back to the recommendation model).
app.claude.support-model=${SUPPORT_MODEL:claude-sonnet-4-6}
# A chat with no new message for this many hours is auto-closed (marked resolved),
# so a returning customer starts a fresh thread instead of a stale one. 0 disables.
app.support.idle-auto-close-hours=${SUPPORT_IDLE_AUTO_CLOSE_HOURS:24}

# --- Actuator (health by default; opt-in Prometheus metrics) ---
# /actuator/health is public (permitAll in SecurityConfig) so load balancers and
# container healthchecks can probe it. Details (which component is down) stay
# hidden from anonymous callers.
#
# Monitoring: set ACTUATOR_EXPOSURE=health,prometheus AND METRICS_PUBLIC=true to
# serve Prometheus metrics (JVM, HTTP latencies/status codes, Hikari pool, cache)
# at /actuator/prometheus. METRICS_PUBLIC makes that endpoint anonymous — only
# enable it when the backend port is reachable solely from your private network /
# scraper, never on a host exposed directly to the internet.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health}
management.endpoint.health.show-details=never
# Kubernetes-style liveness/readiness groups at /actuator/health/{liveness,readiness}.
management.endpoint.health.probes.enabled=true
# SMTP reachability is NOT a health signal for this API. Spring's mail indicator
# opens a real SMTP connection on every probe, so with the healthcheck hitting
# /actuator/health every 15s a broken mail account would (a) flood the log with a
# stack trace per probe and (b) drag the aggregate status to DOWN, which fails the
# container healthcheck and restarts a backend that is otherwise serving fine.
# The app degrades gracefully without mail, so it must not gate the probe. Set
# MAIL_HEALTH_CHECK=true if you deliberately want mail to fail the healthcheck.
management.health.mail.enabled=${MAIL_HEALTH_CHECK:false}
app.metrics.public=${METRICS_PUBLIC:false}

# --- Logging ---
# Default to INFO in production: DEBUG logs include user emails, storage keys and
# request paths (see JwtAuthFilter / GuestAuthFilter debug lines). The dev profile
# raises this back to DEBUG. Override per-env with LOG_LEVEL_APP.
logging.level.com.gridstore.huevista=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# Log file - saved to logs/huevista.log in the project directory by default.
# Override with LOG_FILE to point at an absolute, writable path per environment
# (the Docker image pre-creates /app/logs owned by the non-root runtime user).
logging.file.name=${LOG_FILE:logs/huevista.log}
# Keep last 10 log files, max 10MB each
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
